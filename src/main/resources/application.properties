spring.application.name=wex-transactions

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/transactions;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Treasury Fiscal Data API
treasury.api.base-url=https://api.fiscaldata.treasury.gov
treasury.api.exchange-rates-path=/services/api/fiscal_service/v1/accounting/od/rates_of_exchange

# Exchange rate cache - TTL is long because Treasury rates update quarterly
# maximumSize prevents unbounded growth if many distinct currency+date combos are requested
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=6h

# HTTP client - leave trust-store blank to use the JVM default (covers public CAs)
# To plug in a self-signed or private CA cert: set trust-store to a classpath or file path
http.client.ssl.trust-store=
http.client.ssl.trust-store-password=
http.client.ssl.trust-store-type=JKS
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=5000

# Server
server.port=8080
